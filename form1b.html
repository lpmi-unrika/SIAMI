<!DOCTYPE html>
<html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Membuka Form 1b | SIAMI UNRIKA</title><link rel="stylesheet" href="preview.css?v=8"></head>
<body><div style="min-height:100vh;display:grid;place-items:center;padding:24px"><div class="card" style="max-width:560px;width:100%;padding:28px;text-align:center"><h2>SIAMI UNRIKA</h2><p id="routeText" style="margin-top:10px">Menentukan Form 1b sesuai penugasan...</p></div></div>
<script src="preview.js?v=8"></script><script>
const a=SIAMI_PREVIEW.assignment();
if(!SIAMI_PREVIEW.hasAssignment()){
  routeText.textContent="Belum ada penugasan audit.";
  setTimeout(()=>location.replace("penugasan.html"),700);
}else{
  routeText.textContent=`${a.unitName} · ${SIAMI_PREVIEW.auditFormLabel()} · ${SIAMI_PREVIEW.auditTotal()} butir`;
  location.replace(SIAMI_PREVIEW.form1bUrl());
}
</script></body></html>
